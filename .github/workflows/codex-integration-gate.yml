name: Codex integration gate

on:
  pull_request:
    branches:
      - codex/integration

permissions:
  contents: read

jobs:
  codex-gate:
    name: codex-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out task branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce scoped, secret-safe diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --check "origin/${{ github.base_ref }}...HEAD"
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/codex-changed.txt
          count=$(wc -l < /tmp/codex-changed.txt | tr -d ' ')
          if [ "$count" -gt 400 ]; then exit 1; fi
          if grep -E '(^|/)\.env($|\.)|\.(pem|key|p12|mobileprovision)$|(^|/)secrets/' /tmp/codex-changed.txt; then exit 1; fi
